<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Document</title>
  </head>
  <body>
    <header>
      <div class="div-logo">
        <a class="logo" href="../index.html">
          <img
            src="../img/Murder-Drones-Logo-PNG-1.png"
            alt="Murder Drones Store"
        /></a>
      </div>

      <nav class="header-nav">
        <ul>
          <li>
            <a href="../index.html">Home</a>
          </li>
          <li>
            <a href="./contacto.html">Contacto</a>
          </li>
          <li>
            <a href="./carrito.html" class="carrito-icono"
              >🛒<span id="contador-carrito">0</span></a
            >

            <!-- entramos a la carpeta carrito a través de pages, definimos la clase,el icono se hace con Win+./ Muestra cuántos productos hay (empieza en 0) y tiene un identificador único para que JavaScript pueda encontrarlo y cambiar el número cuando el usuario agrega o quita productos.-->
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <h1>Carrito de compras</h1>
      <section id="contenedor-carrito" class="contenedor-tarjetas">
        <!--Productos del carrito, lo genero y dejo a la espera del código de Js-->
      </section>
      <div id="acciones-carrito" class="acciones-carrito">
        <!-- agrega los botones eliminar y finalizar compra se agregan desde Js, se agregan de Js porque no es necesario que estén siempre es dinámico y depende de si hay o no productos-->
      </div>
      <section id="resumen-carrito" class="resumen-carrito">
        <!--esto es el resumen de los productos agregados, verlo en la clase de reduce-->
      </section>
    </main>

    <footer>
      <p>Sitio realizado por Fla para Talento Tech y mi fotocopia de 9 años</p>
      <p>&copy; 2026 Mi E-Commerce</p>
      <!-- &copy: sirve para mostrar el símbolo de derechos de autor o copyright (©) en una página web-->
      <nav>
        <ul class="footer-list">
          <li><img src="../img/instagram.png" alt="logo de instagram" /></li>
          <li><img src="../img/whatsapp.png" alt="logo de whatsapp" /></li>
        </ul>
      </nav>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!--agregamos el enlace al archivo de js (carrito): sin type module no funciona porque trabajamos en modulos, siempre antes del cierre del body -->
    <script src="../js/carrito.js" type="module"></script>
  </body>
</html>
