<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Document</title>
  </head>
  <body>
    <header>
      <div class="div-logo">
        <a class="logo" href="../index.html">
          <img
            src="../img/Murder-Drones-Logo-PNG-1.png"
            alt="Murder Drones Store"
        /></a>
      </div>

      <nav class="header-nav">
        <ul>
          <li>
            <a href="../index.html">Home</a>
          </li>
          <li>
            <a href="./contacto.html">Contacto</a>
          </li>
          <li>
            <a href="./carrito.html" class="carrito-icono"
              >🛒<span id="contador-carrito">0</span></a
            >
            <!-- entramos a la carpeta carrito a través de pages, definimos la clase,el icono se hace con Win+./ Muestra cuántos productos hay (empieza en 0) y tiene un identificador único para que JavaScript pueda encontrarlo y cambiar el número cuando el usuario agrega o quita productos.-->
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <h1 class="titulo-contacto text-secondary">Dejanos tu mensaje</h1>

      <form
        class="form-contacto"
        action="https://formspree.io/f/mjgllqdy"
        method="POST"
      >
        <div class="grupo-input">
          <label for="nombre"> Nombre: </label>
          <input id="nombre" type="nombre" name="nombre" />
        </div>
        <div class="grupo-input">
          <label for="email"> Email: </label>
          <input id="email" type="email" name="email" />
        </div>
        <div class="grupo-input">
          <label for="mensaje"> Tu mensaje: </label>
          <textarea id="mensaje" name="message"></textarea>
        </div>
        <!-- your other form fields go here -->
        <button class="btn" type="submit">Send</button>
      </form>
    </main>
    <footer>
      <p>Sitio realizado por Fla para Talento Tech y mi fotocopia de 9 años</p>
      <p>&copy; 2026 Mi E-Commerce</p>
      <nav>
        <ul class="footer-list">
          <li><img src="../img/instagram.png" alt="logo de instagram" /></li>
          <li><img src="../img/whatsapp.png" alt="logo de whatsapp" /></li>
        </ul>
      </nav>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!--agregamos el enlace al archivo de js (index): sin type module no funciona porque trabajamos en modulos, siempre antes del cierre del body -->
    <script src="../js/contacto.js" type="module"></script>
  </body>
</html>
